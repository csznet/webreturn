<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webreturn · 会话不存在或已过期</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0d1117;color:#c9d1d9;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;gap:20px;
  }
  .card{
    max-width:440px;width:100%;background:#161b22;border:1px solid #30363d;
    border-radius:10px;padding:36px 32px;text-align:center;
  }
  .icon{
    width:54px;height:54px;border-radius:12px;
    background:#d2992226;border:1px solid #d2992240;color:#d29922;
    display:inline-flex;align-items:center;justify-content:center;
    margin-bottom:18px;
  }
  h1{margin:0 0 8px;font-size:19px;font-weight:600;color:#c9d1d9}
  .desc{color:#8b949e;margin:0 0 22px;font-size:13.5px;line-height:1.65}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    text-decoration:none;font:600 14px inherit;
    padding:10px 22px;border-radius:6px;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .btn-primary{background:#238636;color:#fff;border:1px solid transparent}
  .btn-primary:hover{background:#2ea043}
  .btn-ghost{background:transparent;color:#c9d1d9;border:1px solid #30363d}
  .btn-ghost:hover{background:#21262d;border-color:#444c56}
  .hint{color:#6e7681;font-size:12px;margin-top:18px;line-height:1.6}
  .ghlink{
    display:inline-flex;align-items:center;gap:8px;color:#8b949e;text-decoration:none;
    font-size:12px;
  }
  .ghlink:hover{color:#58a6ff}
  @media (max-width:480px){
    body{padding:16px}
    .card{padding:28px 22px}
    .icon{width:48px;height:48px}
    .icon svg{width:22px;height:22px}
    h1{font-size:18px}
    .actions{flex-direction:column-reverse}
    .btn{width:100%}
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </div>
  <h1>会话不存在或已过期</h1>
  <p class="desc">这个 token 没找到对应的会话 — 可能 TTL 已到期被清理,或者 URL 拼错了。重新生成一个新的回调地址即可。</p>
  <div class="actions">
    <a class="btn btn-ghost" href="/test">在线测试</a>
    <a class="btn btn-primary" href="/">回到首页</a>
  </div>
  <p class="hint">如果你确认会话还在有效期内,请检查地址是否复制完整。</p>
</div>
<a class="ghlink" href="https://github.com/csznet/webreturn" target="_blank" rel="noopener noreferrer">
  <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">

  </svg>
  <span>csznet / webreturn</span>
</a>
</body>
</html>
