<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Webreturn · HTTP 接收与发送</title>
<style>
  :root{
    --bg:#0d1117;
    --surface:#161b22;
    --surface-2:#1c2128;
    --border:#30363d;
    --border-strong:#444c56;
    --accent:#58a6ff;
    --accent-bg:rgba(31,111,235,.18);
    --success:#3fb950;
    --success-bg:rgba(46,160,67,.18);
    --warn:#d29922;
    --danger:#ff7b72;
    --text:#e6edf3;
    --text-muted:#8b949e;
    --text-faint:#6e7681;
    --radius:12px;
    --radius-sm:6px;
    --shadow-1:0 1px 0 rgba(255,255,255,.03), 0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 1px 0 rgba(255,255,255,.04), 0 14px 36px rgba(0,0,0,.4);
    --shadow-accent:0 12px 32px rgba(31,111,235,.18);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","SF Pro Text",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 900px 700px at top center, rgba(88,166,255,.06), transparent 55%),
      radial-gradient(ellipse 700px 500px at bottom right, rgba(63,185,80,.04), transparent 60%),
      var(--bg);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;gap:32px;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    animation:fadein .4s ease-out both;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .hero{text-align:center;max-width:880px;width:100%}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font:500 11px/1 inherit;letter-spacing:.4px;text-transform:uppercase;
    padding:5px 11px;border-radius:999px;
    background:var(--accent-bg);color:var(--accent);
    border:1px solid rgba(88,166,255,.25);
    margin-bottom:16px;
  }
  .badge.green{background:var(--success-bg);color:var(--success);border-color:rgba(63,185,80,.25)}
  h1{
    margin:0 0 8px;font-size:32px;font-weight:700;letter-spacing:-.5px;
    background:linear-gradient(180deg,#fff 0%,#a8b3cf 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{color:var(--text-muted);margin:0;font-size:15px}

  .cards{
    display:grid;grid-template-columns:repeat(2,1fr);gap:18px;
    max-width:880px;width:100%;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);
    padding:28px;display:flex;flex-direction:column;gap:14px;
    text-decoration:none;color:inherit;
    box-shadow:var(--shadow-1);
    transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease,background .2s ease;
  }
  .link-card:hover{
    border-color:rgba(88,166,255,.5);
    transform:translateY(-3px);
    box-shadow:var(--shadow-accent),var(--shadow-1);
    background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
  }
  .link-card:active{transform:translateY(-1px)}
  .icon{
    width:46px;height:46px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(88,166,255,.18),rgba(88,166,255,.04));
    border:1px solid rgba(88,166,255,.25);
    color:var(--accent);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  }
  .icon.green{
    background:linear-gradient(135deg,rgba(63,185,80,.18),rgba(63,185,80,.04));
    border-color:rgba(63,185,80,.25);
    color:var(--success);
  }
  .card h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.2px}
  .card .desc{margin:0;color:var(--text-muted);font-size:13.5px;line-height:1.65;flex:1}

  form{display:flex;flex-direction:column;gap:12px;margin-top:4px}
  .ttl{
    display:inline-flex;align-items:center;gap:10px;
    font-size:12.5px;color:var(--text-muted);
  }
  input[type=text]{
    background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:8px 11px;font:inherit;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  input[type=text]:hover{border-color:var(--border-strong)}
  input[type=text]:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(88,166,255,.18);
  }
  .ttl input{width:120px;flex:0 0 auto}
  button[type=submit]{
    background:linear-gradient(180deg,#2ea043,#238636);
    color:white;border:0;padding:11px 22px;
    font:600 14px inherit;border-radius:var(--radius-sm);cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 1px 2px rgba(0,0,0,.4);
    transition:filter .12s ease,transform .08s ease;
  }
  button[type=submit]:hover{filter:brightness(1.08)}
  button[type=submit]:active{transform:scale(.98)}

  .cta{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--accent);font-weight:500;font-size:14px;
    margin-top:auto;
    transition:gap .18s ease;
  }
  .link-card:hover .cta{gap:10px}

  .hint{font-size:11.5px;color:var(--text-faint)}
  code{
    background:var(--bg);padding:1px 6px;border-radius:4px;
    border:1px solid var(--border);font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
    color:var(--text-muted);
  }

  footer{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--text-faint);font-size:12px;
  }
  .ghlink{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--text);text-decoration:none;
    background:var(--surface);border:1px solid var(--border);
    padding:9px 16px;border-radius:999px;
    font-size:13px;font-weight:500;
    box-shadow:var(--shadow-1);
    transition:all .15s ease;
  }
  .ghlink:hover{
    border-color:var(--accent);color:var(--accent);
    transform:translateY(-1px);
    box-shadow:var(--shadow-accent),var(--shadow-1);
  }
  .ghhint a{color:var(--text-muted);text-decoration:none;transition:color .15s}
  .ghhint a:hover{color:var(--accent)}

  /* iPad / 折叠屏(竖向) — 仍然双栏 */
  @media (max-width:900px){
    body{padding:28px 20px;gap:28px}
    h1{font-size:28px}
    .card{padding:24px}
  }
  /* 大手机 / 平板竖向偏窄 — 收紧间距 */
  @media (max-width:768px){
    .cards{gap:14px}
    .card{padding:22px;gap:12px}
  }
  /* 折成单列 — 大手机及以下 */
  @media (max-width:600px){
    body{padding:22px 16px;gap:22px}
    .cards{grid-template-columns:1fr;gap:14px}
    h1{font-size:26px}
    .tagline{font-size:14px}
  }
  /* 中型手机 */
  @media (max-width:480px){
    body{padding:18px 14px;gap:18px}
    .badge{font-size:10px;margin-bottom:14px}
    h1{font-size:23px}
    .tagline{font-size:13px}
    .card{padding:20px 18px;gap:12px}
    .icon{width:40px;height:40px}
    .icon svg{width:20px;height:20px}
    .card h2{font-size:16.5px}
    .card .desc{font-size:13px}
    .ttl{width:100%;justify-content:space-between}
    .ttl input{width:140px;flex:0 0 140px}
    button[type=submit]{width:100%;padding:11px 16px;min-height:42px}
    .ghlink{padding:8px 14px;font-size:12px}
  }
  /* 窄手机 */
  @media (max-width:360px){
    body{padding:14px 12px}
    .card{padding:16px 14px}
    h1{font-size:21px}
    .ttl{flex-wrap:wrap;gap:6px}
    .ttl input{flex:1 1 100%;width:100%}
  }
  /* 大屏 — 字号微放大 */
  @media (min-width:1200px){
    h1{font-size:36px}
    .card{padding:32px}
    .card h2{font-size:19px}
  }
  /* 减少动效偏好 */
  @media (prefers-reduced-motion:reduce){
    body{animation:none}
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="hero">
  <span class="badge">⚡ Cloudflare Workers</span>
  <h1>Webreturn</h1>
  <p class="tagline">为开发者打造的 HTTP 接收 / 发送两件套</p>
</div>

<div class="cards">
  <div class="card">
    <div class="icon green" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
    </div>
    <h2>接收</h2>
    <p class="desc">分配临时 URL,所有打过来的请求都会实时滚动展示 — Method、URL、Query、Headers、Body 一应俱全。</p>
    <form method="post" action="/api/sessions">
      <label class="ttl">有效期 <input type="text" name="ttl" value="1h" placeholder="1h, 30m, 24h"></label>
      <button type="submit">生成回调地址</button>
      <span class="hint">TTL 格式: <code>30s</code> · <code>10m</code> · <code>1h</code> · <code>24h</code></span>
    </form>
  </div>

  <a class="card link-card" href="/test">
    <div class="icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
      </svg>
    </div>
    <h2>发送</h2>
    <p class="desc">网页版 Postman:method、URL、参数、请求头、Body 一站式调,响应实时显示。免装客户端,带捕获请求一键重放。</p>
    <span class="cta">打开 →</span>
  </a>
</div>

<footer>
  <a class="ghlink" href="https://github.com/csznet/webreturn" target="_blank" rel="noopener noreferrer">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span>csznet / webreturn</span>
  </a>
  <div class="ghhint">在 GitHub 查看源码 · <a href="https://github.com/csznet/webreturn/issues" target="_blank" rel="noopener noreferrer">提 Issue</a> · 欢迎 Star</div>
</footer>
</body>
</html>
