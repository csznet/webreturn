<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webreturn · 在线请求测试</title>
<style>
  :root{
    --bg:#0d1117;
    --surface:#161b22;
    --surface-2:#1c2128;
    --border:#30363d;
    --border-subtle:#21262d;
    --border-strong:#444c56;
    --accent:#58a6ff;
    --accent-bg:rgba(31,111,235,.18);
    --success:#3fb950;
    --warn:#d29922;
    --danger:#ff7b72;
    --text:#e6edf3;
    --text-muted:#8b949e;
    --text-faint:#6e7681;
    --radius:10px;
    --radius-sm:6px;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 4px 16px rgba(0,0,0,.35);
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;
    font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","SF Pro Text",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    animation:fadein .3s ease-out both;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  header{
    padding:14px 22px;border-bottom:1px solid var(--border-subtle);display:flex;
    align-items:center;gap:14px;
    background:rgba(13,17,23,.85);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    position:sticky;top:0;z-index:10;
  }
  .back{
    color:var(--text-muted);text-decoration:none;font:500 13px inherit;
    display:inline-flex;align-items:center;gap:4px;
    padding:6px 10px;border-radius:var(--radius-sm);
    transition:all .15s ease;
  }
  .back:hover{color:var(--accent);background:var(--surface)}
  .htitle{font-size:15px;font-weight:600;flex:1;letter-spacing:-.2px}
  main{padding:20px 22px;max-width:1100px;margin:0 auto}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow-1);
  }

  .req-bar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  select,input[type=text],textarea{
    background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:9px 11px;font:inherit;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  select:hover,input[type=text]:hover,textarea:hover{border-color:var(--border-strong)}
  select:focus,input:focus,textarea:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(88,166,255,.18);
  }
  ::placeholder{color:var(--text-faint);opacity:1}
  #method{font:600 13px var(--mono);width:110px;cursor:pointer;letter-spacing:.3px}
  #url{flex:1;min-width:200px;font-family:var(--mono);font-size:13px}
  #send{
    background:linear-gradient(180deg,#2ea043,#238636);color:white;border:0;
    padding:9px 26px;border-radius:var(--radius-sm);
    font:600 14px inherit;cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.1) inset, 0 1px 2px rgba(0,0,0,.4);
    transition:filter .12s ease,transform .08s ease;
  }
  #send:hover{filter:brightness(1.08)}
  #send:active{transform:scale(.98)}
  #send:disabled{background:var(--border);color:var(--text-faint);cursor:not-allowed;box-shadow:none;filter:none}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border-subtle);margin-bottom:14px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    padding:9px 14px;cursor:pointer;color:var(--text-muted);border:0;background:transparent;
    font:500 13.5px inherit;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
    transition:color .15s ease,border-color .15s ease;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .tab-count{color:var(--text-faint);font-size:11px;margin-left:2px}
  .tab.active .tab-count{color:var(--accent)}
  .tab-pane{display:none}
  .tab-pane.active{display:block}

  .kv-row{display:flex;gap:6px;margin-bottom:6px}
  .kv-row input{flex:1;font-family:var(--mono);font-size:13px;padding:8px 10px}
  .kv-row .del{
    background:transparent;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;
    width:34px;border-radius:var(--radius-sm);font:inherit;
    transition:all .15s ease;
  }
  .kv-row .del:hover{color:var(--danger);border-color:var(--danger);background:rgba(248,81,73,.08)}
  .add-row{
    background:transparent;border:1px dashed var(--border);color:var(--text-muted);cursor:pointer;
    padding:8px 12px;border-radius:var(--radius-sm);font:13px inherit;width:100%;margin-top:4px;
    transition:all .15s ease;
  }
  .add-row:hover{color:var(--accent);border-color:var(--accent);background:rgba(31,111,235,.06)}

  .ct-chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .ct-chip{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:5px 11px;border-radius:999px;font:500 12px inherit;cursor:pointer;
    transition:all .15s ease;
  }
  .ct-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  #body{
    width:100%;min-height:160px;font-family:var(--mono);font-size:12.5px;
    resize:vertical;line-height:1.55;
  }

  .resp-meta{
    display:flex;gap:18px;flex-wrap:wrap;align-items:center;
    padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border-subtle);
    margin:-16px -16px 14px;font-size:13px;
  }
  .status-pill{
    padding:4px 11px;border-radius:999px;font:600 12px var(--mono);
    letter-spacing:.3px;
  }
  .status-2xx{background:rgba(46,160,67,.22);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
  .status-3xx{background:rgba(31,111,235,.22);color:#58a6ff;border:1px solid rgba(31,111,235,.3)}
  .status-4xx,.status-5xx,.status-err{background:rgba(248,81,73,.22);color:#ff7b72;border:1px solid rgba(248,81,73,.3)}
  .meta-label{color:var(--text-muted)}
  .meta-val{color:var(--text);font-family:var(--mono);font-weight:500}

  pre{
    background:var(--bg);border:1px solid var(--border-subtle);padding:11px 13px;
    border-radius:var(--radius-sm);margin:0;font:12.5px/1.6 var(--mono);overflow-x:auto;
    white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;
  }
  table.kv{
    width:100%;border-collapse:collapse;font:12.5px var(--mono);
    background:var(--bg);border:1px solid var(--border-subtle);
    border-radius:var(--radius-sm);overflow:hidden;
  }
  table.kv td{padding:6px 11px;border-bottom:1px solid var(--border-subtle);vertical-align:top;word-break:break-all}
  table.kv tr:last-child td{border-bottom:0}
  table.kv td:first-child{color:var(--text-muted);width:30%}

  .empty-resp{padding:48px 20px;text-align:center;color:var(--text-faint)}

  #history{display:none}
  #history.has-items{display:block}
  .hist-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;
    border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;
    background:var(--bg);
    transition:all .15s ease;
  }
  .hist-item:hover{border-color:var(--accent);background:var(--surface-2)}
  .hist-method{font:600 11px var(--mono);padding:3px 8px;border-radius:4px;min-width:54px;text-align:center;letter-spacing:.3px}
  .hist-method.GET{background:rgba(31,111,235,.22);color:#58a6ff}
  .hist-method.POST{background:rgba(46,160,67,.22);color:#3fb950}
  .hist-method.PUT{background:rgba(163,122,204,.22);color:#d2a8ff}
  .hist-method.DELETE{background:rgba(248,81,73,.22);color:#ff7b72}
  .hist-method.PATCH{background:rgba(219,109,40,.22);color:#ffa657}
  .hist-method.HEAD,.hist-method.OPTIONS{background:rgba(110,118,129,.22);color:#8b949e}
  .hist-status{font:600 11px var(--mono);padding:3px 8px;border-radius:4px}
  .hist-url{flex:1;font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .hist-time{color:var(--text-faint);font:11px var(--mono)}
  .hist-clear{
    background:transparent;border:0;color:var(--text-faint);cursor:pointer;
    font:12px inherit;padding:4px 8px;border-radius:4px;transition:all .12s;
  }
  .hist-clear:hover{color:var(--danger);background:rgba(248,81,73,.08)}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font:600 13px inherit;color:var(--text)}
  .truncate-warn{color:var(--warn);font-size:12px;margin-top:8px}

  /* iPad / 折叠屏 — 略收边距 */
  @media (max-width:1024px){
    main{padding:18px 20px}
  }
  @media (max-width:768px){
    header{padding:13px 18px}
    main{padding:16px 18px}
  }
  /* 大手机及以下 */
  @media (max-width:640px){
    header{padding:12px 14px;gap:10px}
    .htitle{font-size:14px}
    main{padding:14px 12px}
    .card{padding:14px}

    /* 请求栏: method + url 同行,send 独占下一行(更大点击区) */
    .req-bar{gap:6px}
    #method{flex:0 0 90px;width:90px;font-size:13px}
    #url{flex:1 1 calc(100% - 96px);min-width:0;font-size:12px}
    #send{flex:1 1 100%;padding:11px 22px;min-height:42px}

    .tab{padding:9px 12px;font-size:13px}
    .add-row{padding:8px 12px}
    .ct-chip{padding:5px 10px;font-size:12px}
    .kv-row .del{min-height:36px}

    .resp-meta{margin:-14px -14px 12px;padding:11px 14px;gap:14px;font-size:12px;flex-wrap:wrap}
    pre{font-size:11px;padding:9px 11px;max-height:55vh}

    /* 表格竖排 */
    table.kv{display:block}
    table.kv tbody{display:block}
    table.kv tr{display:block;padding:8px 11px;border-bottom:1px solid var(--border-subtle)}
    table.kv tr:last-child{border-bottom:0}
    table.kv td{display:block;padding:0;border:0;width:auto}
    table.kv td:first-child{font-size:11px;margin-bottom:3px}

    .hist-item{flex-wrap:wrap;gap:8px;padding:10px 12px}
    .hist-url{flex:1 1 100%;order:3;font-size:11px}
    .hist-time{margin-left:auto}
  }
  /* 窄屏手机:KV 行竖排,请求栏更紧凑 */
  @media (max-width:420px){
    header{padding:10px 12px;gap:8px}
    .htitle{font-size:13px}
    main{padding:10px}
    .card{padding:11px}
    .section-title{font-size:12px}

    #method{flex:0 0 80px;width:80px;font-size:12px;padding:8px 9px}
    #url{flex:1 1 calc(100% - 86px);font-size:12px;padding:8px 9px}
    #send{padding:11px;font-size:13.5px}

    /* key/value 各占一行,delete 紧贴 key */
    .kv-row{flex-wrap:wrap;gap:4px}
    .kv-row > input:nth-of-type(1){flex:1 1 calc(100% - 36px);font-size:12px;padding:8px 9px}
    .kv-row > input:nth-of-type(2){flex:1 1 100%;font-size:12px;padding:8px 9px}
    .kv-row .del{flex:0 0 32px;width:32px;height:32px;min-height:32px;padding:0}

    .ct-chips{gap:4px}
    .ct-chip{padding:4px 9px;font-size:11px}

    #body{font-size:11.5px;min-height:130px}

    .resp-meta{padding:10px 12px;gap:10px;font-size:11px}
    pre{font-size:10.5px;padding:8px 10px;max-height:48vh}

    .status-pill{font-size:11px;padding:3px 9px}
    .meta-val{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){
    body{animation:none}
    *{transition:none !important}
  }
</style>
</head>
<body>
<header>
  <a href="/" class="back">← 首页</a>
  <span class="htitle">在线请求测试</span>
</header>
<main>
  <div class="card">
    <div class="req-bar">
      <select id="method">
        <option>GET</option><option>POST</option><option>PUT</option>
        <option>DELETE</option><option>PATCH</option><option>HEAD</option><option>OPTIONS</option>
      </select>
      <input id="url" type="text" placeholder="https://api.example.com/path" autocomplete="off" spellcheck="false">
      <button id="send" type="button">发送</button>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="params" type="button">Params <span class="tab-count" id="cnt-params"></span></button>
      <button class="tab" data-tab="headers" type="button">Headers <span class="tab-count" id="cnt-headers"></span></button>
      <button class="tab" data-tab="body" type="button">Body</button>
    </div>
    <div class="tab-pane active" id="pane-params">
      <div id="params-list"></div>
      <button class="add-row" data-add="params" type="button">+ 添加参数</button>
    </div>
    <div class="tab-pane" id="pane-headers">
      <div id="headers-list"></div>
      <button class="add-row" data-add="headers" type="button">+ 添加请求头</button>
    </div>
    <div class="tab-pane" id="pane-body">
      <div class="ct-chips">
        <span style="color:#8b949e;font-size:12px;align-self:center">Content-Type:</span>
        <button class="ct-chip" data-ct="application/json" type="button">JSON</button>
        <button class="ct-chip" data-ct="application/x-www-form-urlencoded" type="button">Form</button>
        <button class="ct-chip" data-ct="text/plain" type="button">Text</button>
        <button class="ct-chip" data-ct="application/xml" type="button">XML</button>
      </div>
      <textarea id="body" placeholder="请求体内容(GET/HEAD 不发送 body)"></textarea>
    </div>
  </div>

  <div class="card" id="response">
    <div class="empty-resp" id="empty-resp">点击「发送」执行请求,响应会显示在这里。</div>
    <div id="resp-content" style="display:none">
      <div class="resp-meta">
        <span class="status-pill" id="resp-status">—</span>
        <span><span class="meta-label">耗时</span> <span class="meta-val" id="resp-time">—</span></span>
        <span><span class="meta-label">大小</span> <span class="meta-val" id="resp-size">—</span></span>
      </div>
      <div class="tabs">
        <button class="tab active" data-rtab="body" type="button">Body</button>
        <button class="tab" data-rtab="headers" type="button">Headers <span id="cnt-rheaders"></span></button>
      </div>
      <div class="tab-pane active" id="rpane-body">
        <pre id="resp-body"></pre>
        <p class="truncate-warn" id="trunc-warn" style="display:none">⚠ 响应已超过 5 MiB,显示已截断</p>
      </div>
      <div class="tab-pane" id="rpane-headers">
        <table class="kv"><tbody id="resp-headers"></tbody></table>
      </div>
    </div>
  </div>

  <div class="card" id="history">
    <div class="section-title">
      <span>历史记录(最近 20 条,本地存储)</span>
      <button class="hist-clear" id="hist-clear" type="button">清空</button>
    </div>
    <div id="hist-list"></div>
  </div>
</main>
<script>
const HISTORY_KEY = 'webreturn:test-history';
const state = {
  method: 'GET',
  url: '',
  params: [{k:'',v:''}],
  headers: [{k:'',v:''}],
  body: '',
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function nonEmpty(rows){ return rows.filter(r => r.k.trim() !== ''); }
function ensureTrailing(rows){
  if (rows.length === 0 || rows[rows.length-1].k || rows[rows.length-1].v) {
    rows.push({k:'',v:''});
  }
}
function refreshCounts(){
  $('cnt-params').textContent = nonEmpty(state.params).length ? `(${nonEmpty(state.params).length})` : '';
  $('cnt-headers').textContent = nonEmpty(state.headers).length ? `(${nonEmpty(state.headers).length})` : '';
}

function renderRows(listId, rows){
  const list = $(listId);
  list.innerHTML = '';
  rows.forEach((row, idx) => {
    const div = document.createElement('div');
    div.className = 'kv-row';
    const ki = document.createElement('input');
    ki.type='text'; ki.placeholder='key'; ki.value=row.k; ki.spellcheck=false; ki.autocomplete='off';
    const vi = document.createElement('input');
    vi.type='text'; vi.placeholder='value'; vi.value=row.v; vi.spellcheck=false; vi.autocomplete='off';
    const del = document.createElement('button');
    del.type='button'; del.className='del'; del.textContent='×';
    ki.addEventListener('input', () => { row.k = ki.value; refreshCounts(); ensureTail(listId, rows); });
    vi.addEventListener('input', () => { row.v = vi.value; refreshCounts(); ensureTail(listId, rows); });
    del.addEventListener('click', () => {
      rows.splice(idx, 1);
      if (rows.length === 0) rows.push({k:'',v:''});
      renderRows(listId, rows);
      refreshCounts();
    });
    div.append(ki, vi, del);
    list.appendChild(div);
  });
}
function ensureTail(listId, rows){
  if (rows[rows.length-1].k || rows[rows.length-1].v) {
    rows.push({k:'',v:''});
    renderRows(listId, rows);
  }
}

renderRows('params-list', state.params);
renderRows('headers-list', state.headers);

document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
  const which = b.dataset.add;
  state[which].push({k:'',v:''});
  renderRows(which + '-list', state[which]);
}));

// Tabs (request)
document.querySelectorAll('.tabs .tab[data-tab]').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab[data-tab]').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('[id^="pane-"]').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('pane-' + t.dataset.tab).classList.add('active');
}));
// Tabs (response)
document.querySelectorAll('.tab[data-rtab]').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab[data-rtab]').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('[id^="rpane-"]').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('rpane-' + t.dataset.rtab).classList.add('active');
}));

// Content-Type chips
document.querySelectorAll('.ct-chip').forEach(c => c.addEventListener('click', () => {
  const ct = c.dataset.ct;
  const found = state.headers.find(h => h.k.toLowerCase() === 'content-type');
  if (found) found.v = ct;
  else state.headers.unshift({k:'Content-Type', v:ct});
  ensureTrailing(state.headers);
  renderRows('headers-list', state.headers);
  refreshCounts();
  document.querySelector('.tab[data-tab="headers"]').click();
}));

$('method').addEventListener('change', e => state.method = e.target.value);
$('url').addEventListener('input', e => state.url = e.target.value);
$('body').addEventListener('input', e => state.body = e.target.value);

// 发送
$('send').addEventListener('click', sendRequest);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') sendRequest(); });

async function sendRequest(){
  if (!state.url.trim()) { $('url').focus(); return; }

  // 把 query params 合到 URL
  let target = state.url.trim();
  const qp = nonEmpty(state.params);
  if (qp.length) {
    const qs = qp.map(p => `${encodeURIComponent(p.k)}=${encodeURIComponent(p.v)}`).join('&');
    target += target.includes('?') ? '&' + qs : '?' + qs;
  }
  const headers = nonEmpty(state.headers).map(h => [h.k, h.v]);

  const sendBtn = $('send');
  sendBtn.disabled = true;
  sendBtn.textContent = '发送中...';
  $('empty-resp').style.display = 'none';
  $('resp-content').style.display = 'block';
  $('resp-status').textContent = '...';
  $('resp-status').className = 'status-pill';
  $('resp-time').textContent = '—';
  $('resp-size').textContent = '—';
  $('resp-body').textContent = '';
  $('resp-headers').innerHTML = '';

  const t0 = performance.now();
  let data;
  try {
    const r = await fetch('/api/proxy', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ method: state.method, url: target, headers, body: state.body }),
    });
    data = await r.json();
  } catch (e) {
    data = { error: e.message || '网络错误' };
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
  }
  const t1 = performance.now();

  renderResponse(data, Math.round(t1 - t0));
  saveHistory({ method: state.method, url: target, headers, body: state.body }, data);
}

function renderResponse(data, fallbackElapsed){
  if (data.error) {
    $('resp-status').textContent = '错误';
    $('resp-status').className = 'status-pill status-err';
    $('resp-time').textContent = (data.elapsed_ms ?? fallbackElapsed) + ' ms';
    $('resp-size').textContent = '—';
    $('resp-body').textContent = data.error;
    return;
  }
  const cls = data.status >= 200 && data.status < 300 ? 'status-2xx'
            : data.status >= 300 && data.status < 400 ? 'status-3xx'
            : data.status >= 400 && data.status < 500 ? 'status-4xx'
            : 'status-5xx';
  $('resp-status').textContent = data.status + ' ' + (data.status_text || '').replace(/^\d+\s*/, '') || data.status;
  $('resp-status').className = 'status-pill ' + cls;
  $('resp-time').textContent = data.elapsed_ms + ' ms';
  $('resp-size').textContent = formatBytes(data.body_size);

  let bodyText = data.body || '';
  if (data.binary) {
    bodyText = `(二进制响应,${data.body_size} 字节,Base64)\n\n` + bodyText;
  } else {
    const trim = bodyText.trim();
    if ((trim.startsWith('{') && trim.endsWith('}')) || (trim.startsWith('[') && trim.endsWith(']'))) {
      try { bodyText = JSON.stringify(JSON.parse(trim), null, 2); } catch {}
    }
  }
  $('resp-body').textContent = bodyText;
  $('trunc-warn').style.display = data.truncated ? 'block' : 'none';

  const tbody = $('resp-headers');
  tbody.innerHTML = '';
  (data.headers || []).forEach(([k, v]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(k)}</td><td>${esc(v)}</td>`;
    tbody.appendChild(tr);
  });
  $('cnt-rheaders').textContent = (data.headers || []).length ? `(${data.headers.length})` : '';
}

function formatBytes(n){
  if (n == null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/(1024*1024)).toFixed(2) + ' MB';
}

// 历史记录
function loadHistory(){
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}
function saveHistoryList(list){
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
}
function saveHistory(req, resp){
  const list = loadHistory();
  list.unshift({
    ts: Date.now(),
    method: req.method,
    url: req.url,
    headers: req.headers,
    body: req.body,
    status: resp.status || null,
    elapsed: resp.elapsed_ms || null,
    error: resp.error || null,
  });
  saveHistoryList(list.slice(0, 20));
  renderHistory();
}
function renderHistory(){
  const list = loadHistory();
  const wrap = $('history');
  const ul = $('hist-list');
  if (list.length === 0) { wrap.classList.remove('has-items'); ul.innerHTML = ''; return; }
  wrap.classList.add('has-items');
  ul.innerHTML = '';
  list.forEach(h => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    const sCls = h.error ? 'status-err'
               : !h.status ? 'status-err'
               : h.status >= 200 && h.status < 300 ? 'status-2xx'
               : h.status >= 300 && h.status < 400 ? 'status-3xx'
               : 'status-4xx';
    const sText = h.error ? 'ERR' : (h.status || '?');
    div.innerHTML = `
      <span class="hist-method ${esc(h.method)}">${esc(h.method)}</span>
      <span class="hist-status ${sCls}">${sText}</span>
      <span class="hist-url">${esc(h.url)}</span>
      <span class="hist-time">${h.elapsed != null ? h.elapsed + 'ms' : ''}</span>
    `;
    div.addEventListener('click', () => loadFromHistory(h));
    ul.appendChild(div);
  });
}
function loadFromHistory(h){
  state.method = h.method;
  $('method').value = h.method;
  try {
    const u = new URL(h.url);
    state.url = u.origin + u.pathname;
    $('url').value = state.url;
    state.params = [];
    u.searchParams.forEach((v, k) => state.params.push({k, v}));
    state.params.push({k:'',v:''});
  } catch {
    state.url = h.url;
    $('url').value = h.url;
    state.params = [{k:'',v:''}];
  }
  state.headers = (h.headers || []).map(([k, v]) => ({k, v}));
  ensureTrailing(state.headers);
  state.body = h.body || '';
  $('body').value = state.body;
  renderRows('params-list', state.params);
  renderRows('headers-list', state.headers);
  refreshCounts();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
$('hist-clear').addEventListener('click', () => {
  if (confirm('清空所有历史记录?')) { saveHistoryList([]); renderHistory(); }
});

// 从回调查看页跳转过来时,自动把请求填入(目标 URL 留空)
(function tryApplyReplay(){
  if (location.hash !== '#replay') return;
  history.replaceState({}, '', location.pathname);
  let data;
  try {
    const raw = localStorage.getItem('webreturn:replay');
    if (!raw) return;
    data = JSON.parse(raw);
    localStorage.removeItem('webreturn:replay');
  } catch { return; }
  if (!data) return;
  state.method = data.method || 'GET';
  $('method').value = state.method;
  state.url = '';
  $('url').value = '';
  state.headers = (data.headers || []).map(([k, v]) => ({k, v}));
  ensureTrailing(state.headers);
  state.params = (data.params || []).map(([k, v]) => ({k, v}));
  ensureTrailing(state.params);
  state.body = data.body || '';
  $('body').value = state.body;
  renderRows('params-list', state.params);
  renderRows('headers-list', state.headers);
  setTimeout(() => $('url').focus(), 80);
})();

renderHistory();
refreshCounts();
</script>
