<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webreturn · {{.Host}}:{{.Port}}</title>
<style>
  :root{
    --bg:#0d1117;
    --surface:#161b22;
    --surface-2:#1c2128;
    --border:#30363d;
    --border-subtle:#21262d;
    --border-strong:#444c56;
    --accent:#58a6ff;
    --accent-bg:rgba(31,111,235,.18);
    --success:#3fb950;
    --warn:#d29922;
    --danger:#ff7b72;
    --text:#e6edf3;
    --text-muted:#8b949e;
    --text-faint:#6e7681;
    --radius:10px;
    --radius-sm:6px;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 4px 16px rgba(0,0,0,.35);
    --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font:14.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","SF Pro Text",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    animation:fadein .3s ease-out both;
  }
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  header{
    padding:14px 22px;border-bottom:1px solid var(--border-subtle);display:flex;
    align-items:center;gap:12px;flex-wrap:wrap;
    background:rgba(13,17,23,.85);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    position:sticky;top:0;z-index:10;
  }
  .title{font-size:13px;color:var(--text-muted);font-weight:500}
  .url{
    font-family:var(--mono);background:var(--surface);border:1px solid var(--border);
    padding:8px 13px;border-radius:var(--radius-sm);font-size:13.5px;user-select:all;color:#79c0ff;
    box-shadow:var(--shadow-1);
  }
  .btn{
    background:var(--surface-2);color:var(--text);border:1px solid var(--border);text-decoration:none;
    padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;font:500 13px inherit;
    display:inline-flex;align-items:center;gap:5px;
    transition:all .15s ease;
  }
  .btn:hover{background:#22272e;border-color:var(--border-strong)}
  .btn:active{transform:scale(.97)}
  .btn.danger{color:var(--danger)}
  .meta{margin-left:auto;font-size:13px;color:var(--text-muted);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .status{display:inline-flex;align-items:center;gap:7px;font-weight:500}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);transition:background .2s}
  .status.live .dot{background:var(--success);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2.2s ease-in-out infinite}
  .status.expired .dot{background:var(--warn)}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(63,185,80,.6)}
    50%{box-shadow:0 0 0 6px rgba(63,185,80,0)}
  }

  main{padding:20px 22px;max-width:1200px;margin:0 auto}
  .empty{
    text-align:center;padding:90px 20px;color:var(--text-faint);
    background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty p{margin:6px 0}
  .empty p:first-child{font-size:16px;color:var(--text-muted)}

  .req{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-1);
    transition:border-color .15s ease;
  }
  .req:hover{border-color:var(--border-strong)}
  .req-head{
    padding:11px 14px;display:flex;align-items:center;gap:12px;
    cursor:pointer;user-select:none;flex-wrap:wrap;
  }
  .req-head:hover{background:var(--surface-2)}
  .method{
    font:600 11.5px var(--mono);padding:4px 9px;border-radius:5px;
    min-width:62px;text-align:center;letter-spacing:.3px;
  }
  .method.GET{background:rgba(31,111,235,.22);color:#58a6ff;border:1px solid rgba(31,111,235,.3)}
  .method.POST{background:rgba(46,160,67,.22);color:#3fb950;border:1px solid rgba(46,160,67,.3)}
  .method.PUT{background:rgba(163,122,204,.22);color:#d2a8ff;border:1px solid rgba(163,122,204,.3)}
  .method.DELETE{background:rgba(248,81,73,.22);color:#ff7b72;border:1px solid rgba(248,81,73,.3)}
  .method.PATCH{background:rgba(219,109,40,.22);color:#ffa657;border:1px solid rgba(219,109,40,.3)}
  .method.HEAD,.method.OPTIONS{background:rgba(110,118,129,.22);color:#8b949e;border:1px solid rgba(110,118,129,.3)}
  .path{font-family:var(--mono);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .from{color:var(--text-muted);font-size:12px;font-family:var(--mono)}
  .ts{color:var(--text-faint);font-size:12px;font-family:var(--mono)}
  .body-section{display:none;padding:16px;border-top:1px solid var(--border-subtle);background:rgba(0,0,0,.15)}
  .req.open .body-section{display:block}
  .section-title{
    font:600 10.5px inherit;text-transform:uppercase;color:var(--text-muted);
    letter-spacing:.6px;margin:16px 0 7px;
  }
  .section-title:first-child{margin-top:0}
  pre{
    background:var(--bg);border:1px solid var(--border-subtle);padding:11px 13px;
    border-radius:var(--radius-sm);margin:0;font:12.5px/1.6 var(--mono);overflow-x:auto;
    white-space:pre-wrap;word-break:break-all;
  }
  table{
    width:100%;border-collapse:collapse;font:12.5px var(--mono);
    background:var(--bg);border:1px solid var(--border-subtle);
    border-radius:var(--radius-sm);overflow:hidden;
  }
  td{padding:6px 11px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td:first-child{color:var(--text-muted);width:30%;word-break:break-all}
  td:last-child{word-break:break-all;color:var(--text)}
  .warn{color:var(--warn);font-size:12px;margin:8px 0 0}

  .req.new{animation:flash .9s ease-out}
  @keyframes flash{
    0%{background:rgba(31,111,235,.22);box-shadow:0 0 0 0 rgba(88,166,255,.4)}
    100%{background:var(--surface);box-shadow:var(--shadow-1)}
  }

  .clear{font-size:12px;color:var(--text-muted);cursor:pointer;background:transparent;border:0;padding:4px 8px;border-radius:4px;transition:all .12s}
  .clear:hover{color:var(--text);background:var(--surface)}
  .copied{color:var(--success) !important}

  .action-bar{display:flex;justify-content:flex-end;margin-bottom:8px}
  .replay-btn{
    background:var(--accent-bg);color:var(--accent);border:1px solid rgba(88,166,255,.3);
    padding:6px 13px;border-radius:var(--radius-sm);cursor:pointer;
    font:600 12px inherit;display:inline-flex;align-items:center;gap:5px;
    transition:all .15s ease;
  }
  .replay-btn:hover{background:rgba(31,111,235,.32);border-color:var(--accent);transform:translateY(-1px)}
  .replay-btn:active{transform:none}

  /* iPad / 折叠屏 */
  @media (max-width:1024px){
    main{padding:18px 20px}
  }
  @media (max-width:768px){
    header{padding:13px 18px}
    main{padding:16px 18px}
  }
  /* 大手机及以下 */
  @media (max-width:640px){
    header{padding:12px 14px;gap:8px}
    .title{display:none}
    .url{order:-1;flex:1 1 100%;font-size:12px;padding:8px 10px;text-align:center;word-break:break-all}
    .btn{padding:8px 13px;font-size:13px;min-height:36px}
    .meta{margin-left:0;width:100%;flex-wrap:wrap;gap:10px;justify-content:space-between;font-size:12px}
    main{padding:14px 12px}
    .req-head{padding:10px 12px;gap:8px;row-gap:6px}
    .path{flex:1 1 100%;font-size:12px}
    .from{font-size:11px}
    .ts{font-size:11px;margin-left:auto}
    .body-section{padding:13px}
    pre{font-size:11px;padding:9px 11px;max-height:60vh}
    .section-title{margin-top:14px}
    .replay-btn{padding:7px 14px;font-size:12px;min-height:34px}
    table{display:block}
    tbody{display:block}
    tr{display:block;padding:8px 11px;border-bottom:1px solid var(--border-subtle)}
    tr:last-child{border-bottom:0}
    td{display:block;padding:0;border:0;width:auto}
    td:first-child{font-size:11px;margin-bottom:3px}
    .empty{padding:60px 20px}
  }
  @media (max-width:380px){
    header{padding:10px 12px;gap:6px}
    main{padding:10px}
    .url{font-size:11px}
    .btn{padding:7px 11px}
    .meta{font-size:11px;gap:8px}
    .ts{display:none}
    .body-section{padding:11px}
    pre{font-size:10.5px;padding:8px 10px}
  }
  @media (prefers-reduced-motion:reduce){
    body{animation:none}
    .status.live .dot{animation:none}
    *{transition:none !important}
  }
</style>
</head>
<body>
<header>
  <span class="title">回调地址</span>
  <span class="url" id="url">{{.URL}}</span>
  <button class="btn" id="copyBtn" type="button">复制</button>
  <a class="btn" href="/">新建</a>
  <div class="meta">
    <span class="status" id="status"><span class="dot"></span><span id="statusText">连接中...</span></span>
    <span id="ttl">剩余: --</span>
    <button class="clear" id="clearBtn" type="button">清空显示</button>
  </div>
</header>
<main>
  <div id="empty" class="empty">
    <p style="font-size:16px">等待请求中...</p>
    <p style="font-size:13px">向上面的地址发送任意 HTTP 请求,内容会实时显示在这里。</p>
  </div>
  <div id="list"></div>
</main>
<script>
  const TOKEN = {{.Token}};
  const EXPIRES_MS = {{.ExpiresMs}};
  const URL_STR = {{.URL}};

  const $list = document.getElementById('list');
  const $empty = document.getElementById('empty');
  const $status = document.getElementById('status');
  const $statusText = document.getElementById('statusText');
  const $ttl = document.getElementById('ttl');
  const $copyBtn = document.getElementById('copyBtn');
  const $clearBtn = document.getElementById('clearBtn');
  const seen = new Set();

  $copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(URL_STR); } catch {}
    $copyBtn.textContent = '已复制';
    $copyBtn.classList.add('copied');
    setTimeout(() => { $copyBtn.textContent = '复制'; $copyBtn.classList.remove('copied'); }, 1200);
  });

  $clearBtn.addEventListener('click', () => {
    $list.innerHTML = '';
    $empty.style.display = '';
    seen.clear();
  });

  function fmtTime(iso){
    const d = new Date(iso);
    const pad = (n,l=2) => String(n).padStart(l,'0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(),3)}`;
  }
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function kvTable(obj){
    if(!obj || Object.keys(obj).length === 0) return '<pre>(空)</pre>';
    let html = '<table>';
    const keys = Object.keys(obj).sort();
    for(const k of keys){
      const vs = obj[k];
      const vals = Array.isArray(vs) ? vs : [vs];
      html += `<tr><td>${esc(k)}</td><td>${vals.map(esc).join('<br>')}</td></tr>`;
    }
    return html + '</table>';
  }
  function tryPretty(s){
    if(!s) return s;
    const trim = s.trim();
    if((trim.startsWith('{') && trim.endsWith('}')) || (trim.startsWith('[') && trim.endsWith(']'))){
      try { return JSON.stringify(JSON.parse(trim), null, 2); } catch {}
    }
    return s;
  }
  function renderRequest(req, animate){
    if(seen.has(req.id)) return;
    seen.add(req.id);
    $empty.style.display = 'none';

    const div = document.createElement('div');
    div.className = 'req' + (animate ? ' new' : '');

    let bodyHTML = '<pre>(空)</pre>';
    if(req.body && req.body.length){
      bodyHTML = `<pre>${esc(tryPretty(req.body))}</pre>`;
      if(req.truncated) bodyHTML += `<p class="warn">⚠ body 已截断(超出最大记录尺寸)</p>`;
    }

    const fullPath = esc(req.path) + (req.raw_query ? '?' + esc(req.raw_query) : '');
    const requestLine = `${esc(req.method)} ${esc(req.url)} ${esc(req.proto)}\nHost: ${esc(req.host)}`;

    div.innerHTML = `
      <div class="req-head">
        <span class="method ${esc(req.method)}">${esc(req.method)}</span>
        <span class="path">${fullPath}</span>
        <span class="from">${esc(req.remote_addr)}</span>
        <span class="ts">${fmtTime(req.timestamp)}</span>
      </div>
      <div class="body-section">
        <div class="action-bar">
          <button class="replay-btn" type="button" title="把这次请求填进 /test,只需补一个目标 URL">重放 →</button>
        </div>
        <div class="section-title">请求行</div>
        <pre>${requestLine}</pre>
        <div class="section-title">Query 参数</div>
        ${kvTable(req.query)}
        <div class="section-title">Headers</div>
        ${kvTable(req.headers)}
        <div class="section-title">Body (${req.body_size} 字节)</div>
        ${bodyHTML}
      </div>
    `;
    div.querySelector('.req-head').addEventListener('click', () => div.classList.toggle('open'));
    div.querySelector('.replay-btn').addEventListener('click', e => {
      e.stopPropagation();
      replayRequest(req);
    });
    $list.insertBefore(div, $list.firstChild);
  }

  function replayRequest(req){
    const skipH = new Set(['host', 'content-length']);
    const headers = [];
    for (const [k, vs] of Object.entries(req.headers || {})) {
      if (skipH.has(k.toLowerCase())) continue;
      const arr = Array.isArray(vs) ? vs : [vs];
      for (const v of arr) headers.push([k, v]);
    }
    const params = [];
    for (const [k, vs] of Object.entries(req.query || {})) {
      const arr = Array.isArray(vs) ? vs : [vs];
      for (const v of arr) params.push([k, v]);
    }
    const payload = { method: req.method, headers, params, body: req.body || '' };
    try { localStorage.setItem('webreturn:replay', JSON.stringify(payload)); }
    catch (e) { alert('保存重放数据失败: ' + e.message); return; }
    window.open('/test#replay', '_blank', 'noopener');
  }

  function setStatus(state, text){
    $status.classList.remove('live','expired');
    if(state) $status.classList.add(state);
    $statusText.textContent = text;
  }

  function tickTTL(){
    const ms = EXPIRES_MS - Date.now();
    if(ms <= 0){ $ttl.textContent = '已过期'; return; }
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    let txt = '剩余: ';
    if(h) txt += h + '时';
    if(h || m) txt += m + '分';
    txt += sec + '秒';
    $ttl.textContent = txt;
  }
  setInterval(tickTTL, 1000);
  tickTTL();

  let retryDelay = 1000;
  function connect(){
    setStatus('', '连接中...');
    const es = new EventSource(`/api/sessions/${TOKEN}/events`);
    es.addEventListener('open', () => { setStatus('live', '已连接'); retryDelay = 1000; });
    es.addEventListener('request', e => {
      const req = JSON.parse(e.data);
      const isLive = $status.classList.contains('live');
      renderRequest(req, isLive);
    });
    es.addEventListener('expired', () => {
      setStatus('expired', '会话已过期');
      es.close();
    });
    es.addEventListener('error', () => {
      setStatus('', `断线重连 (${retryDelay/1000}s)`);
      es.close();
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 15000);
    });
  }
  connect();
</script>
</body>
</html>
