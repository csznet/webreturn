<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webreturn · 开发回调与请求工具</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0d1117;color:#c9d1d9;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;gap:28px;
  }
  .hero{text-align:center;max-width:880px;width:100%}
  .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:10px;background:#2ea04340;color:#3fb950;margin-bottom:12px;letter-spacing:.3px}
  h1{margin:0 0 6px;font-size:24px;font-weight:600}
  .tagline{color:#8b949e;margin:0;font-size:14px}

  .cards{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;
    max-width:880px;width:100%;
  }
  .card{
    background:#161b22;border:1px solid #30363d;border-radius:10px;padding:28px;
    display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;
    transition:border-color .15s ease,transform .15s ease;
  }
  .link-card:hover{border-color:#58a6ff;transform:translateY(-2px)}
  .card h2{margin:0;font-size:17px;font-weight:600}
  .card .desc{margin:0;color:#8b949e;font-size:13px;line-height:1.6;flex:1}
  .icon{
    width:42px;height:42px;border-radius:10px;background:#0d1117;border:1px solid #30363d;
    display:flex;align-items:center;justify-content:center;color:#58a6ff;
  }
  .icon.green{color:#3fb950}
  form{display:flex;flex-direction:column;gap:12px}
  .ttl{display:inline-flex;align-items:center;gap:10px;font-size:12px;color:#8b949e}
  input[type=text]{
    background:#0d1117;color:#c9d1d9;border:1px solid #30363d;
    padding:7px 10px;border-radius:6px;width:100%;font:inherit;
  }
  input[type=text]:focus{outline:none;border-color:#58a6ff}
  .ttl input{width:120px;flex:0 0 auto}
  button[type=submit]{
    background:#238636;color:white;border:0;padding:10px 22px;
    font:600 14px inherit;border-radius:6px;cursor:pointer;
  }
  button[type=submit]:hover{background:#2ea043}
  .cta{
    display:inline-flex;align-items:center;gap:6px;color:#58a6ff;font-weight:500;font-size:14px;
    margin-top:auto;
  }
  .hint{font-size:11px;color:#6e7681}
  code{background:#0d1117;padding:1px 6px;border-radius:3px;border:1px solid #21262d;font-size:12px}

  footer{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:#6e7681;font-size:12px;
  }
  .ghlink{
    display:inline-flex;align-items:center;gap:8px;color:#c9d1d9;text-decoration:none;
    background:#161b22;border:1px solid #30363d;padding:8px 16px;border-radius:999px;
    font-size:13px;font-weight:500;
    transition:border-color .15s ease,color .15s ease,transform .15s ease;
  }
  .ghlink:hover{border-color:#58a6ff;color:#58a6ff;transform:translateY(-1px)}
  .ghhint a{color:#8b949e;text-decoration:none}
  .ghhint a:hover{color:#58a6ff}

  @media (max-width:700px){
    .cards{grid-template-columns:1fr;gap:12px}
    body{gap:22px}
  }
  @media (max-width:480px){
    body{padding:16px;gap:18px}
    .badge{font-size:10px}
    h1{font-size:20px}
    .tagline{font-size:13px}
    .card{padding:22px 18px;gap:12px}
    .icon{width:38px;height:38px}
    .icon svg{width:20px;height:20px}
    .card h2{font-size:16px}
    .card .desc{font-size:12.5px}
    .ttl{width:100%;justify-content:space-between}
    .ttl input{width:140px;flex:0 0 140px}
    button[type=submit]{width:100%;padding:11px}
    .ghlink{padding:7px 14px;font-size:12px}
    .ghhint{font-size:11px}
  }
  @media (max-width:360px){
    body{padding:14px}
    .card{padding:18px 14px}
    h1{font-size:18px}
    .ttl{flex-wrap:wrap;gap:6px}
    .ttl input{flex:1 1 100%;width:100%}
  }
</style>
</head>
<body>
<div class="hero">
  <span class="badge">Self-hosted</span>
  <h1>Webreturn</h1>
  <p class="tagline">开发回调捕获 + 在线请求测试</p>
</div>

<div class="cards">
  <div class="card">
    <div class="icon green" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
      </svg>
    </div>
    <h2>接收</h2>
    <p class="desc">随机分配空闲端口启动监听器,实时显示所有打过来的请求 — Method、URL、Query、Headers、Body 一览无余。</p>
    <form method="post" action="/api/sessions">
      <label class="ttl">有效期 <input type="text" name="ttl" value="{{.DefaultTTL}}" placeholder="1h, 30m, 24h"></label>
      <button type="submit">生成回调地址</button>
      <span class="hint">TTL 格式: <code>30s</code> · <code>10m</code> · <code>1h</code> · <code>24h</code></span>
    </form>
  </div>

  <a class="card link-card" href="/test">
    <div class="icon" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m22 2-7 20-4-9-9-4Z"/>
        <path d="M22 2 11 13"/>
      </svg>
    </div>
    <h2>发送</h2>
    <p class="desc">网页版 Postman:输入 URL、选择 method、调参数与请求头、查看响应,免装客户端。</p>
    <span class="cta">打开 →</span>
  </a>
</div>

<footer>
  <a class="ghlink" href="https://github.com/csznet/webreturn" target="_blank" rel="noopener noreferrer">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span>csznet / webreturn</span>
  </a>
  <div class="ghhint">在 GitHub 查看源码 · <a href="https://github.com/csznet/webreturn/issues" target="_blank" rel="noopener noreferrer">提 Issue</a> · 欢迎 Star</div>
</footer>
</body>
</html>
